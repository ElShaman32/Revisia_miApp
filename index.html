<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D2818">
    <meta name="description" content="Cambur Pintón - La Radio Más Chevere de Venezuela. Con El Cuatro Bien Afinado.">
    <meta property="og:title" content="Cambur Pintón - La Radio Más Chevere de Venezuela">
    <meta property="og:description" content="Con El Cuatro Bien Afinado.">
    <meta property="og:image" content="https://radio.camburpinton.com.ve/static/uploads/background.1778449035.png">
    <meta property="og:type" content="music.radio_station">
    
    <title id="pageTitle">🍌 Cambur Pintón</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #1A1A2E;
            --surface: #16213E;
            --cambur-yellow: #FFD700;
            --cambur-green: #7CB342;
            --cambur-dark: #0D2818;
            --text: #FFFFFF;
            --text-secondary: #A5D6A7;
            --border: rgba(124, 179, 66, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --string1: #FFD700;
            --string2: #FF8C00;
            --string3: #FF4500;
            --string4: #8B0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            padding-top: 46px;
        }

        /* ============================================================
           📱 BARRA SUPERIOR - REDES SOCIALES + HORA VENEZUELA
           ============================================================ */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 46px;
            background: rgba(13, 40, 24, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(124, 179, 66, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1001;
            font-size: 13px;
        }

        .social-icons {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .social-icons a {
            color: var(--cambur-green);
            font-size: 16px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .social-icons a:hover {
            color: var(--cambur-yellow);
            transform: translateY(-2px);
            filter: drop-shadow(0 2px 6px rgba(255, 215, 0, 0.4));
        }

        .venezuela-time {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
        }

        .venezuela-time .flag { font-size: 18px; }
        .venezuela-time .time { color: #FFFFFF; letter-spacing: 1px; }

        /* ============================================================
           📰 BARRA DE TITULARES DESLIZANTE (RSS VENEZOLANO)
           ============================================================ */
        .ticker-bar {
            background: rgba(124, 179, 66, 0.1);
            border-bottom: 1px solid rgba(124, 179, 66, 0.2);
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-bar a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
        }

        .ticker-bar a:hover { color: #FFFFFF; text-decoration: underline; }

        .ticker-content {
            display: inline-block;
            animation: ticker 80s linear infinite;
            padding-left: 100%;
        }

        .ticker-content span.separator {
            margin: 0 15px;
            color: var(--cambur-green);
        }

        .ticker-label {
            color: var(--cambur-green);
            font-weight: 700;
            margin-right: 20px;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ============================================================
           🏠 HERO - DOS COLUMNAS
           ============================================================ */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            background: linear-gradient(180deg, #0D2818 0%, #1A1A2E 100%);
            position: relative;
            overflow: hidden;
            min-height: 500px;
            gap: 40px;
            flex-wrap: wrap;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://radio.camburpinton.com.ve/static/uploads/background.1778449035.png');
            background-repeat: repeat;
            background-size: 80px;
            opacity: 0.03;
        }

        .hero-left {
            text-align: center;
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 280px;
            max-width: 450px;
        }

        .hero-right {
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 280px;
            max-width: 500px;
            text-align: center;
        }

        .logo-img {
            width: 150px;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(124, 179, 66, 0.5));
            animation: float 3s ease-in-out infinite;
            border-radius: 50%;
            border: 3px solid rgba(124, 179, 66, 0.3);
            background: rgba(13, 40, 24, 0.6);
            padding: 10px;
            margin-bottom: 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .station-name {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #7CB342, #558B2F, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .tagline {
            font-size: 18px;
            color: #A5D6A7;
            margin-bottom: 5px;
            font-style: italic;
        }

        .hero-subtitle {
            font-size: 15px;
            color: #A5D6A7;
            font-style: italic;
            margin-bottom: 30px;
        }

        .hero-player {
            background: var(--surface);
            border: 2px solid var(--cambur-green);
            border-radius: 50px;
            padding: 12px 25px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .player-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid var(--cambur-green);
            background: rgba(124, 179, 66, 0.1);
            color: var(--cambur-green);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .player-btn:hover { background: rgba(124, 179, 66, 0.2); transform: scale(1.05); }

        .player-btn.playing {
            border-color: var(--cambur-yellow);
            color: var(--cambur-yellow);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: bold;
            color: var(--cambur-green);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--cambur-green);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .now-playing-hero { text-align: left; }

        .np-title {
            font-size: 14px;
            font-weight: 600;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-artist { font-size: 11px; color: var(--text-secondary); }

        .strings-container {
            display: flex;
            gap: 2px;
            height: 20px;
            align-items: flex-end;
        }

        .string { width: 2px; border-radius: 1px; transition: height 0.1s; }
        .s1 { background: var(--string1); }
        .s2 { background: var(--string2); }
        .s3 { background: var(--string3); }
        .s4 { background: var(--string4); }

        .modelo-img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 24px;
            border: 3px solid rgba(124, 179, 66, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            filter: brightness(0.9) saturate(1.1);
            transition: transform 0.3s;
        }

        .modelo-img:hover { transform: scale(1.02); }

        .listeners-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: rgba(124, 179, 66, 0.15);
            border: 1px solid rgba(124, 179, 66, 0.3);
            border-radius: 20px;
            font-size: 13px;
            color: var(--cambur-green);
        }

        .listeners-count { font-weight: 700; color: #FFFFFF; }

        /* ============================================================
           🎵 HISTORIAL - LO QUE YA MADURÓ
           ============================================================ */
        .history-section {
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .history-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            color: #FFFFFF;
        }

        .history-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: #7CB342;
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .history-timeline {
            position: relative;
            padding-left: 50px;
        }

        .history-timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 16px;
            background: repeating-linear-gradient(
                to bottom,
                transparent, transparent 2px,
                var(--string4) 2px, var(--string4) 3px,
                transparent 3px, transparent 6px,
                var(--string3) 6px, var(--string3) 7px,
                transparent 7px, transparent 10px,
                var(--string2) 10px, var(--string2) 11px,
                transparent 11px, transparent 14px,
                var(--string1) 14px, var(--string1) 15px,
                transparent 15px, transparent 20px
            );
            opacity: 0.15;
            border-radius: 8px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            position: relative;
            cursor: default;
        }

        .history-emoji {
            position: absolute;
            left: -29px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            z-index: 2;
            transition: all 0.3s;
        }

        .history-item:first-child .history-emoji {
            font-size: 28px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
            animation: float 2s ease-in-out infinite;
        }

        .history-item:not(:first-child) .history-emoji {
            filter: drop-shadow(0 0 5px rgba(124, 179, 66, 0.3));
        }

        .history-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            flex: 1;
            transition: all 0.3s;
        }

        .history-item:first-child .history-card {
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .history-card:hover {
            background: rgba(22, 33, 62, 0.8);
            border-color: rgba(124, 179, 66, 0.5);
        }

        .history-song { font-size: 15px; font-weight: 700; color: #FFFFFF; margin-bottom: 4px; }
        .history-artist { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .history-time { font-size: 11px; color: var(--cambur-green); font-style: italic; }
        .history-placeholder { text-align: center; color: var(--text-secondary); font-style: italic; padding: 30px; }

        /* ============================================================
           🎵 MODAL PEDIR CANCIÓN
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border: 2px solid var(--cambur-green);
            border-radius: var(--radius);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .modal h3 { margin-bottom: 10px; font-size: 20px; }
        .modal p { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }

        .modal input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: #FFFFFF;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        .modal input:focus { border-color: var(--cambur-green); }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-modal {
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            border: none;
        }

        .btn-send {
            background: var(--cambur-green);
            color: #FFFFFF;
        }
        .btn-send:hover { background: #689F38; }

        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.05); }

        .modal-confirmation {
            display: none;
            color: var(--cambur-green);
            font-weight: 700;
            margin-top: 15px;
        }

        /* ============================================================
           📰 NOTICIAS PINTONAS
           ============================================================ */
        .news-section {
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            color: #FFFFFF;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: #7CB342;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .news-update-time {
            text-align: center;
            font-size: 12px;
            color: #7CB342;
            margin-bottom: 20px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .news-category {
            font-size: 12px;
            color: var(--cambur-green);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .news-excerpt {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .news-placeholder {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 40px;
            grid-column: 1 / -1;
        }

        /* ============================================================
           💬 COMUNIDAD
           ============================================================ */
        .community-section {
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .community-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #25D366;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: #20BD5C;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .btn-telegram {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #0088cc;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        .btn-telegram:hover {
            background: #0077b5;
